<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>se. — users</title>
<link rel="stylesheet" href="/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
</head>
<body class="admin">
<div class="page-header">
  <a class="mark" href="/">se.</a>
  <button id="sign-out" class="text-button" type="button">Sign out</button>
</div>
<div class="admin-shell">
<nav class="admin-rail" id="admin-rail" aria-label="Admin sections"></nav>
<main>
  <h2>Users</h2>
  <p class="lede" style="margin: 0 0 1.5rem;">Regular-user accounts that can sign in and search, but never reach this admin backend -- separate from the single admin account configured at install time.</p>

  <button id="add-user-btn" class="text-button" type="button">Add user</button>
  <div id="users-status" class="panel-status"></div>
  <div id="users-table"></div>

  <section class="panel" id="user-form-panel" hidden>
    <h2 id="user-form-title">Add user</h2>
    <form id="user-form" class="stacked-form">
      <div class="form-row">
        <label for="user-username">Username</label>
        <input id="user-username" class="field" type="text" required autocomplete="off">
      </div>
      <div class="form-row">
        <div class="label-row">
          <label for="user-password" id="user-password-label">Password</label>
          <span class="hint" tabindex="0"><span class="hint-icon" aria-hidden="true">i</span><span class="hint-bubble">At least 8 characters. Stored as a bcrypt hash -- never shown again after saving.</span></span>
        </div>
        <input id="user-password" class="field" type="password" autocomplete="new-password" minlength="8">
      </div>
      <div class="form-row">
        <button id="user-save-btn" type="submit">Save</button>
        <button id="user-cancel-btn" type="button" class="text-button">Cancel</button>
      </div>
      <span id="user-form-status" class="error-text"></span>
    </form>
  </section>
</main>
</div>
<script src="/admin.js"></script>
<script src="/admin_users.js"></script>
</body>
</html>
