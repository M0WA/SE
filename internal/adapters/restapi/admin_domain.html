<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>se. — domain</title>
<link rel="stylesheet" href="/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
</head>
<body class="admin">
<div class="page-header">
  <a class="mark" href="/">se.</a>
  <button id="sign-out" class="header-icon-button" type="button" title="Sign out" aria-label="Sign out"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
</div>
<div class="admin-shell">
<nav class="admin-rail" id="admin-rail" aria-label="Admin sections"></nav>
<main>
  <a class="back" href="/admin/documents">Back to Documents</a>

  <div class="domain-head" id="domain-head">
    <h3 id="domain-title">Loading…</h3>
    <span class="domain-head-tail" id="domain-tail"></span>
  </div>
  <button id="delete-all" class="text-button" type="button" style="margin-bottom: 0.75rem;" hidden>Delete all in this domain</button>
  <p id="delete-all-status" class="panel-status"></p>
  <div id="domain-status" class="panel-status"></div>
  <div id="domain-chart"></div>
  <input id="domain-filter" class="field" type="text" placeholder="Filter pages (regex) — matches title or URL" aria-label="Filter pages" hidden>
  <div id="domain-filter-error" class="error-text"></div>
  <div id="domain-table"></div>

  <section class="panel" id="history-panel" hidden>
    <h2 id="history-heading">History</h2>
    <div id="history-body"></div>
  </section>
</main>
</div>
<script src="/admin.js"></script>
<script src="/admin_domain.js"></script>
</body>
</html>
