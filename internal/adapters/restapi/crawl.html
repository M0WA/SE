<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>se. — add a page</title>
<link rel="stylesheet" href="/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
</head>
<body>
<main>
  <a class="back" href="/">&larr; se.</a>
  <form id="crawl-form" class="crawl-form" autocomplete="off">
    <input id="crawl-url" class="field" name="url" type="url" placeholder="https://example.com" autofocus required>
    <input id="max-pages" name="max_pages" type="number" min="1" value="20" aria-label="Max pages">
    <button type="submit">Crawl</button>
  </form>
  <div id="crawl-status"></div>
</main>
<script>
  const crawlForm = document.getElementById('crawl-form');
  const crawlURL = document.getElementById('crawl-url');
  const maxPages = document.getElementById('max-pages');
  const crawlStatus = document.getElementById('crawl-status');

  crawlForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const url = crawlURL.value.trim();
    if (!url) {
      crawlStatus.textContent = 'Enter a URL to crawl.';
      return;
    }
    const pages = parseInt(maxPages.value, 10) || 20;
    crawlStatus.textContent = 'Crawling…';
    try {
      const resp = await fetch('/crawl', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ seed_urls: [url], max_pages: pages }),
      });
      if (!resp.ok) {
        const msg = await resp.text();
        crawlStatus.textContent = 'Crawl failed: ' + msg.trim();
        return;
      }
      const data = await resp.json();
      const count = data.crawled_count || 0;
      crawlStatus.textContent = count === 1
        ? 'Indexed 1 page.'
        : 'Indexed ' + count + ' pages.';
    } catch (err) {
      crawlStatus.textContent = 'Crawl failed: could not reach the server.';
    }
  });
</script>
</body>
</html>
