<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>se. — result</title>
<link rel="stylesheet" href="/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
</head>
<body class="admin">
<main>
  <div class="page-header">
    <a class="mark" href="/">se.</a>
    <button id="sign-out" class="text-button" type="button">Sign out</button>
  </div>
  <a class="back" href="/admin/search">Back to search debug</a>

  <div id="result-status" class="panel-status"></div>
  <div id="result-body" hidden>
    <div class="result-detail-head">
      <h2><a id="result-title" href="#" target="_blank" rel="noopener noreferrer"></a></h2>
      <p class="result-detail-url" id="result-url"></p>
    </div>
    <div class="result-detail-score">
      <span class="k">final score</span>
      <span id="result-final"></span>
    </div>
    <p class="result-detail-snippet" id="result-snippet"></p>

    <section class="panel">
      <h2>Score composition</h2>
      <div class="composition-track" id="composition-track"></div>
      <div class="composition-legend" id="composition-legend"></div>
      <p class="composition-note" id="composition-note" hidden></p>
    </section>

    <section class="panel">
      <h2>BM25 breakdown</h2>
      <p class="tuning-caption" id="bm25-caption"></p>
      <div id="bm25-terms"></div>
    </section>

    <section class="panel">
      <h2>Semantic similarity</h2>
      <p class="lede" style="margin: 0 0 1rem;">How close this document's meaning is to the query's, independent of exact wording.</p>
      <div class="bar-row">
        <span class="bar-label">cosine sim.</span>
        <div class="bar-track"><div class="bar-fill" id="semantic-fill"></div></div>
        <span class="bar-value" id="semantic-value"></span>
      </div>
    </section>

    <section class="panel">
      <h2>PageRank</h2>
      <div id="pagerank-kv"></div>
    </section>
  </div>
</main>
<script src="/admin.js"></script>
<script src="/admin_search_result.js"></script>
</body>
</html>
