<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>se. — documents</title>
<link rel="stylesheet" href="/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
</head>
<body class="admin">
<div class="page-header">
  <a class="mark" href="/">se.</a>
  <button id="sign-out" class="header-icon-button" type="button" title="Sign out" aria-label="Sign out"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
</div>
<div class="admin-shell">
<nav class="admin-rail" id="admin-rail" aria-label="Admin sections"></nav>
<main>
  <section class="panel">
    <h2>Domain/URL Search</h2>
    <form id="domain-search-form" class="crawl-form" style="margin-bottom: 0.5rem;">
      <input id="domain-q" class="field" type="text" placeholder="Search domains or URLs (regex)…" aria-label="Search domains or URLs" autocomplete="off">
    </form>
    <div id="domain-search-error" class="panel-status"></div>
    <div id="domain-results"></div>
    <div id="document-results"></div>
  </section>

  <section class="panel">
    <h2>Vocabulary</h2>
    <form id="vocab-search-form" class="vocab-controls">
      <input id="vocab-q" class="field" type="text" placeholder="Filter vocabulary (substring)…" aria-label="Filter vocabulary" autocomplete="off">
      <label for="vocab-page-size" class="vocab-page-size-label">Per page
        <input id="vocab-page-size" class="field vocab-page-size" type="number" min="1" step="1" value="20">
      </label>
    </form>
    <div id="vocab-summary"></div>
    <div id="vocab-table"></div>
    <div id="vocab-pager" class="pager" hidden>
      <button id="vocab-prev" class="text-button" type="button">Previous</button>
      <span id="vocab-page-info"></span>
      <button id="vocab-next" class="text-button" type="button">Next</button>
    </div>
  </section>
</main>
</div>
<script src="/admin.js"></script>
<script src="/admin_documents.js"></script>
</body>
</html>
