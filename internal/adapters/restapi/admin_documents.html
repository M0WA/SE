<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>se. — documents</title>
<link rel="stylesheet" href="/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
</head>
<body class="admin">
<main>
  <div class="page-header">
    <a class="mark" href="/">se.</a>
    <button id="sign-out" class="text-button" type="button">Sign out</button>
  </div>
  <nav class="admin-nav">
    <a href="/admin">Overview</a>
    <a href="/admin/documents" aria-current="page">Documents</a>
    <a href="/admin/crawl">Crawl</a>
    <a href="/admin/tuning">Tuning</a>
    <a href="/admin/search">Search</a>
    <a href="/admin/overrides">Overrides</a>
  </nav>

  <p class="lede" style="margin: 0 0 1.5rem;">Every crawled domain gets its own page — search for one below to see its pages, length spread, and version history.</p>

  <form id="domain-search-form" class="crawl-form" style="margin-bottom: 0.5rem;">
    <input id="domain-q" class="field" type="text" placeholder="Find a domain…" autofocus autocomplete="off">
  </form>
  <div id="domain-results"></div>

  <section class="panel">
    <h2>Index at a glance</h2>
    <div id="overview-status" class="panel-status"></div>
    <div id="overview-charts"></div>
  </section>
</main>
<script src="/admin.js"></script>
<script>
  const domainQ = document.getElementById('domain-q');
  const domainResultsEl = document.getElementById('domain-results');
  const overviewStatusEl = document.getElementById('overview-status');
  const overviewChartsEl = document.getElementById('overview-charts');

  let searchTimer = null;

  function renderDomainResults(domains, q) {
    clear(domainResultsEl);
    if (q === '') return;
    if (domains.length === 0) {
      domainResultsEl.textContent = 'No crawled domain matches “' + q + '”.';
      return;
    }
    const list = document.createElement('div');
    list.className = 'domain-result-list';
    for (const d of domains) {
      const row = document.createElement('a');
      row.className = 'domain-result';
      row.href = '/admin/documents/' + encodeURIComponent(d.host);
      const name = document.createElement('span');
      name.textContent = d.host;
      const count = document.createElement('span');
      count.className = 'domain-metrics';
      count.textContent = d.doc_count + (d.doc_count === 1 ? ' page' : ' pages');
      row.appendChild(name);
      row.appendChild(count);
      list.appendChild(row);
    }
    domainResultsEl.appendChild(list);
  }

  async function searchDomains() {
    const q = domainQ.value.trim();
    if (q === '') {
      clear(domainResultsEl);
      return;
    }
    try {
      const domains = await getJSON('/admin/api/domains?q=' + encodeURIComponent(q));
      renderDomainResults(domains, q);
    } catch (err) {
      domainResultsEl.textContent = 'Could not search domains: ' + err.message;
    }
  }

  domainQ.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(searchDomains, 200);
  });
  document.getElementById('domain-search-form').addEventListener('submit', (e) => {
    e.preventDefault();
    clearTimeout(searchTimer);
    searchDomains();
  });

  // A quiet, single-color donut: shade (not hue) ranks each domain, so the
  // chart stays in the site's one-accent palette. The legend beside it is
  // what actually distinguishes domains -- the arcs are a supporting
  // silhouette of the corpus's shape, not meant to be read precisely.
  function buildDonut(domains, total) {
    const size = 120;
    const r = 46;
    const strokeWidth = 16;
    const circumference = 2 * Math.PI * r;

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
    svg.setAttribute('width', size);
    svg.setAttribute('height', size);
    svg.classList.add('donut-chart');

    const track = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    track.setAttribute('cx', size / 2);
    track.setAttribute('cy', size / 2);
    track.setAttribute('r', r);
    track.setAttribute('fill', 'none');
    track.setAttribute('stroke', 'var(--rule)');
    track.setAttribute('stroke-width', strokeWidth);
    svg.appendChild(track);

    let offset = 0;
    domains.forEach((d, i) => {
      const frac = total > 0 ? d.doc_count / total : 0;
      const len = frac * circumference;
      const arc = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      arc.setAttribute('cx', size / 2);
      arc.setAttribute('cy', size / 2);
      arc.setAttribute('r', r);
      arc.setAttribute('fill', 'none');
      arc.setAttribute('stroke', 'var(--accent)');
      arc.setAttribute('stroke-opacity', Math.max(0.25, 1 - i * (0.65 / Math.max(1, domains.length - 1))).toFixed(2));
      arc.setAttribute('stroke-width', strokeWidth);
      arc.setAttribute('stroke-dasharray', len.toFixed(1) + ' ' + (circumference - len).toFixed(1));
      arc.setAttribute('stroke-dashoffset', (-offset).toFixed(1));
      arc.setAttribute('transform', 'rotate(-90 ' + size / 2 + ' ' + size / 2 + ')');
      const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
      title.textContent = d.host + ' — ' + d.doc_count + (d.doc_count === 1 ? ' page' : ' pages');
      arc.appendChild(title);
      svg.appendChild(arc);
      offset += len;
    });
    return svg;
  }

  function buildDonutLegend(domains) {
    const legend = document.createElement('div');
    legend.className = 'donut-legend';
    domains.forEach((d, i) => {
      const row = document.createElement('div');
      row.className = 'donut-legend-row';
      const swatch = document.createElement('span');
      swatch.className = 'donut-swatch';
      swatch.style.opacity = Math.max(0.25, 1 - i * (0.65 / Math.max(1, domains.length - 1))).toFixed(2);
      const label = document.createElement('a');
      label.href = '/admin/documents/' + encodeURIComponent(d.host);
      label.textContent = d.host;
      const count = document.createElement('span');
      count.className = 'domain-metrics';
      count.textContent = String(d.doc_count);
      row.appendChild(swatch);
      row.appendChild(label);
      row.appendChild(count);
      legend.appendChild(row);
    });
    return legend;
  }

  function buildAgeBars(buckets) {
    const maxCount = Math.max.apply(null, buckets.map((b) => b.count).concat([1]));
    const wrap = document.createElement('div');
    wrap.className = 'age-bars';
    for (const b of buckets) {
      const col = document.createElement('div');
      col.className = 'age-bar-col';
      const bar = document.createElement('div');
      bar.className = 'age-bar';
      bar.style.height = Math.max(2, (b.count / maxCount) * 80) + 'px';
      bar.title = b.label + ': ' + b.count + (b.count === 1 ? ' page' : ' pages');
      const count = document.createElement('div');
      count.className = 'age-bar-count';
      count.textContent = String(b.count);
      const label = document.createElement('div');
      label.className = 'age-bar-label';
      label.textContent = b.label;
      col.appendChild(count);
      col.appendChild(bar);
      col.appendChild(label);
      wrap.appendChild(col);
    }
    return wrap;
  }

  async function loadOverview() {
    try {
      const overview = await getJSON('/admin/api/documents/overview');
      clear(overviewChartsEl);
      const total = overview.top_domains.reduce((sum, d) => sum + d.doc_count, 0);
      if (total === 0) {
        overviewStatusEl.textContent = 'No documents indexed yet.';
        return;
      }
      overviewStatusEl.textContent = '';

      const row = document.createElement('div');
      row.className = 'overview-row';

      const domainBlock = document.createElement('div');
      domainBlock.className = 'overview-block';
      const domainHeading = document.createElement('h3');
      domainHeading.textContent = 'Pages per domain';
      domainBlock.appendChild(domainHeading);
      const donutWrap = document.createElement('div');
      donutWrap.className = 'donut-wrap';
      donutWrap.appendChild(buildDonut(overview.top_domains, total));
      donutWrap.appendChild(buildDonutLegend(overview.top_domains));
      domainBlock.appendChild(donutWrap);
      row.appendChild(domainBlock);

      const ageBlock = document.createElement('div');
      ageBlock.className = 'overview-block';
      const ageHeading = document.createElement('h3');
      ageHeading.textContent = 'Age of indexed content';
      ageBlock.appendChild(ageHeading);
      ageBlock.appendChild(buildAgeBars(overview.age_buckets));
      row.appendChild(ageBlock);

      overviewChartsEl.appendChild(row);
    } catch (err) {
      overviewStatusEl.textContent = 'Could not load overview: ' + err.message;
    }
  }

  wireSignOut();
  loadOverview();
</script>
</body>
</html>
