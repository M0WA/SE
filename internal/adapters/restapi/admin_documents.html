<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>se. — documents</title>
<link rel="stylesheet" href="/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
</head>
<body class="admin">
<main>
  <div class="page-header">
    <a class="mark" href="/">se.</a>
    <button id="sign-out" class="text-button" type="button">Sign out</button>
  </div>
  <nav class="admin-nav">
    <a href="/admin">Overview</a>
    <a href="/admin/documents" aria-current="page">Documents</a>
    <a href="/admin/crawl">Crawl</a>
    <a href="/admin/jobs">Jobs</a>
    <a href="/admin/settings">Settings</a>
    <a href="/admin/search">Search</a>
    <a href="/admin/pagerank">PageRank</a>
    <a href="/admin/database">Database</a>
  </nav>

  <section class="panel">
    <h2>Domain/URL Search</h2>
    <form id="domain-search-form" class="crawl-form" style="margin-bottom: 0.5rem;">
      <input id="domain-q" class="field" type="text" placeholder="Search domains or URLs (regex)…" autofocus autocomplete="off">
    </form>
    <div id="domain-search-error" class="panel-status"></div>
    <div id="domain-results"></div>
    <div id="document-results"></div>
  </section>

  <section class="panel">
    <h2>Vocabulary Search</h2>
    <form id="vocab-search-form" class="crawl-form" style="margin-bottom: 0.5rem;">
      <input id="vocab-q" class="field" type="text" placeholder="Search vocabulary (regex)…" autocomplete="off">
    </form>
    <div id="vocab-error" class="panel-status"></div>
    <div id="vocab-summary"></div>
    <div id="vocab-table"></div>
  </section>
</main>
<script src="/admin.js"></script>
<script src="/admin_documents.js"></script>
</body>
</html>
