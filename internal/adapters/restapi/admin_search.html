<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>se. — search debug</title>
<link rel="stylesheet" href="/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
</head>
<body class="admin">
<main>
  <div class="page-header">
    <a class="mark" href="/">se.</a>
    <button id="sign-out" class="text-button" type="button">Sign out</button>
  </div>
  <nav class="admin-nav">
    <a href="/admin">Overview</a>
    <a href="/admin/documents">Documents</a>
    <a href="/admin/crawl">Schedule</a>
    <a href="/admin/jobs">Jobs</a>
    <a href="/admin/settings">Settings</a>
    <a href="/admin/search" aria-current="page">Search</a>
    <a href="/admin/pagerank">PageRank</a>
    <a href="/admin/embeddings">Embeddings</a>
    <a href="/admin/content_dedup">Content dedup</a>
    <a href="/admin/database">Database</a>
  </nav>

  <section class="panel">
    <h2>Debug a query</h2>
    <p class="lede" style="margin: 0 0 1rem;">Shows the BM25 and semantic scores behind a search's ranking, unblended. Supports +required, -excluded, "exact phrase", and site:host terms.</p>
    <form id="debug-form" class="panel-form">
      <input id="debug-q" class="field" type="text" placeholder='cats +required -excluded "exact phrase" site:example.com' required>
      <select id="debug-sort" class="field" aria-label="Sort order">
        <option value="relevance" selected>Best match</option>
        <option value="recency">Most recent</option>
      </select>
      <button type="submit">Run</button>
    </form>
    <div id="debug-status" class="panel-status"></div>
    <div id="debug-result"></div>
    <div id="debug-pager" class="pager" hidden>
      <button id="debug-prev" class="text-button" type="button">Previous</button>
      <span id="debug-page-info"></span>
      <button id="debug-next" class="text-button" type="button">Next</button>
    </div>
  </section>

  <section class="panel">
    <h2>Look up a term</h2>
    <form id="postings-form" class="panel-form">
      <input id="postings-term" class="field" type="text" placeholder="a single token, e.g. cats" required>
      <button type="submit">Look up</button>
    </form>
    <div id="postings-status" class="panel-status"></div>
    <div id="postings-result"></div>
  </section>
</main>
<script src="/admin.js"></script>
<script src="/admin_search.js"></script>
</body>
</html>
