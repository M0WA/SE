<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>se.</title>
<style>
  @font-face {
    font-family: "Source Serif 4";
    src: local("Source Serif 4");
  }

  :root {
    --paper: #edf0f1;
    --ink: #15202b;
    --ink-muted: #55636f;
    --rule: #c7cdd1;
    --accent: #7a2035;
    --accent-soft: rgba(122, 32, 53, 0.12);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #10151c;
      --ink: #e7ecef;
      --ink-muted: #8b99a6;
      --rule: #29323c;
      --accent: #d98a9b;
      --accent-soft: rgba(217, 138, 155, 0.16);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
  }

  body {
    font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
    font-size: 17px;
    line-height: 1.5;
    padding: 12vh 20px 8vh;
    min-height: 100vh;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
  }

  .mark {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--ink);
    margin: 0 0 2.5rem;
  }

  form {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.6rem;
  }

  .field {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 1.2rem;
    color: var(--ink);
    background: transparent;
    border: none;
    outline: none;
    padding: 0.2rem 0;
  }

  .field::placeholder { color: var(--ink-muted); }

  .field:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 2px;
  }

  button {
    font: inherit;
    font-size: 0.95rem;
    color: var(--ink-muted);
    background: none;
    border: none;
    padding: 0.2rem 0;
    cursor: pointer;
  }

  button:hover { color: var(--accent); }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 2px;
  }

  #status {
    margin-top: 1rem;
    color: var(--ink-muted);
    font-size: 0.95rem;
    min-height: 1.2em;
  }

  #results { margin-top: 0.5rem; }

  .result {
    padding: 1.15rem 0;
    border-bottom: 1px solid var(--rule);
  }

  .result:last-child { border-bottom: none; }

  .result-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
  }

  .result-title {
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--ink);
    text-decoration: none;
  }

  .result-title:hover { text-decoration: underline; }

  .result-score {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 0.85rem;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .result-url {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 0.8rem;
    color: var(--ink-muted);
    margin-top: 0.2rem;
    word-break: break-all;
  }

  .result-snippet {
    margin-top: 0.5rem;
    font-size: 0.97rem;
    line-height: 1.6;
    color: var(--ink);
  }

  .result-snippet mark {
    background: var(--accent-soft);
    color: var(--ink);
    padding: 0 0.15em;
    border-radius: 2px;
  }

  @media (prefers-reduced-motion: no-preference) {
    main { animation: rise 0.4s ease-out; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    body { padding-top: 8vh; }
    .result-head { flex-wrap: wrap; }
  }

  .crawl {
    margin-top: 3.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
  }

  .crawl summary {
    cursor: pointer;
    color: var(--ink-muted);
    font-size: 0.9rem;
    user-select: none;
    width: fit-content;
  }

  .crawl summary:hover { color: var(--accent); }

  .crawl summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 2px;
  }

  .crawl-form {
    margin-top: 1.1rem;
    display: flex;
    align-items: baseline;
    gap: 1rem;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.6rem;
  }

  .crawl-form .field { font-size: 1rem; }

  #max-pages {
    width: 3.5rem;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 0.9rem;
    text-align: right;
    color: var(--ink-muted);
    background: transparent;
    border: none;
    outline: none;
    padding: 0.2rem 0;
  }

  #max-pages:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 2px;
  }

  #crawl-status {
    margin-top: 0.75rem;
    color: var(--ink-muted);
    font-size: 0.9rem;
    min-height: 1.2em;
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
</head>
<body>
<main>
  <p class="mark">se.</p>
  <form id="search-form" autocomplete="off">
    <input id="q" class="field" name="q" type="text" placeholder="Search the index…" autofocus>
    <button type="submit">Search</button>
  </form>
  <div id="status"></div>
  <div id="results"></div>

  <details class="crawl">
    <summary>Add a page to the index</summary>
    <form id="crawl-form" autocomplete="off">
      <input id="crawl-url" class="field" name="url" type="url" placeholder="https://example.com" required>
      <input id="max-pages" name="max_pages" type="number" min="1" value="20" aria-label="Max pages">
      <button type="submit">Crawl</button>
    </form>
    <div id="crawl-status"></div>
  </details>
</main>
<script>
  const form = document.getElementById('search-form');
  const input = document.getElementById('q');
  const status = document.getElementById('status');
  const results = document.getElementById('results');

  function clear(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  function renderResults(query, list) {
    clear(results);
    if (list.length === 0) {
      status.textContent = 'No matches for “' + query + '”.';
      return;
    }
    status.textContent = list.length === 1 ? '1 match' : list.length + ' matches';
    for (const r of list) {
      const row = document.createElement('div');
      row.className = 'result';

      const head = document.createElement('div');
      head.className = 'result-head';

      const title = document.createElement('a');
      title.className = 'result-title';
      title.href = r.url;
      title.target = '_blank';
      title.rel = 'noopener noreferrer';
      title.textContent = r.title || r.url;
      head.appendChild(title);

      const score = document.createElement('span');
      score.className = 'result-score';
      score.textContent = Number(r.score).toFixed(3);
      head.appendChild(score);

      row.appendChild(head);

      const url = document.createElement('div');
      url.className = 'result-url';
      url.textContent = r.url;
      row.appendChild(url);

      if (r.snippet) {
        const snippet = document.createElement('div');
        snippet.className = 'result-snippet';
        snippet.innerHTML = r.snippet;
        row.appendChild(snippet);
      }

      results.appendChild(row);
    }
  }

  async function runSearch(query) {
    clear(results);
    status.textContent = 'Searching…';
    try {
      const resp = await fetch('/search?q=' + encodeURIComponent(query));
      if (!resp.ok) {
        const msg = await resp.text();
        status.textContent = 'Search failed: ' + msg.trim();
        return;
      }
      const data = await resp.json();
      renderResults(query, data.results || []);
    } catch (err) {
      status.textContent = 'Search failed: could not reach the server.';
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const query = input.value.trim();
    if (!query) {
      status.textContent = 'Type something to search for.';
      clear(results);
      return;
    }
    runSearch(query);
  });

  const crawlForm = document.getElementById('crawl-form');
  const crawlURL = document.getElementById('crawl-url');
  const maxPages = document.getElementById('max-pages');
  const crawlStatus = document.getElementById('crawl-status');

  crawlForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const url = crawlURL.value.trim();
    if (!url) {
      crawlStatus.textContent = 'Enter a URL to crawl.';
      return;
    }
    const pages = parseInt(maxPages.value, 10) || 20;
    crawlStatus.textContent = 'Crawling…';
    try {
      const resp = await fetch('/crawl', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ seed_urls: [url], max_pages: pages }),
      });
      if (!resp.ok) {
        const msg = await resp.text();
        crawlStatus.textContent = 'Crawl failed: ' + msg.trim();
        return;
      }
      const data = await resp.json();
      const count = data.crawled_count || 0;
      crawlStatus.textContent = count === 1
        ? 'Indexed 1 page.'
        : 'Indexed ' + count + ' pages.';
    } catch (err) {
      crawlStatus.textContent = 'Crawl failed: could not reach the server.';
    }
  });
</script>
</body>
</html>
