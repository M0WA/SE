name: Dependabot Auto-Merge

# Arms auto-merge on every Dependabot PR the moment it's opened (or
# resynced after a rebase), so it merges itself the instant its required
# "Build, vet & test" check goes green -- no need to come back and merge
# each one by hand. main's ruleset still requires that PR + green check
# (see CLAUDE.md's "Branch, PR & release workflow"); this only arms the
# same auto-merge a human would otherwise click on in the PR's UI, it
# doesn't bypass anything.
#
# Uses pull_request_target rather than pull_request: GitHub deliberately
# gives a Dependabot-authored pull_request run a read-only token (the same
# restriction as a fork PR, to stop a malicious dependency manifest from
# exfiltrating secrets), which can't call the merge API. pull_request_target
# runs with the base repo's normal token instead -- safe here because this
# job never checks out or executes the PR's own code, only calls the
# GitHub API to flip the auto-merge flag.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
