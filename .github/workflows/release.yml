name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  GO_VERSION: "1.25"

jobs:
  package-debian:
    name: Build .deb (Debian)
    runs-on: ubuntu-latest
    container: golang:1.25-bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - env:
          CGO_ENABLED: "0"
        run: make deb PKG_VERSION=${{ steps.version.outputs.version }}
      - run: mv build/searchengine_${{ steps.version.outputs.version }}_amd64.deb build/searchengine_${{ steps.version.outputs.version }}_debian_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: searchengine-debian-amd64-deb
          path: build/searchengine_${{ steps.version.outputs.version }}_debian_amd64.deb

  package-ubuntu:
    name: Build .deb (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - env:
          CGO_ENABLED: "0"
        run: make deb PKG_VERSION=${{ steps.version.outputs.version }}
      - run: mv build/searchengine_${{ steps.version.outputs.version }}_amd64.deb build/searchengine_${{ steps.version.outputs.version }}_ubuntu_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: searchengine-ubuntu-amd64-deb
          path: build/searchengine_${{ steps.version.outputs.version }}_ubuntu_amd64.deb

  release:
    name: Publish GitHub Release
    needs: [package-debian, package-ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          generate_release_notes: true
          files: |
            artifacts/searchengine-debian-amd64-deb/*.deb
            artifacts/searchengine-ubuntu-amd64-deb/*.deb
