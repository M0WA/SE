name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # tag-release.yml pushes the release tag using the default GITHUB_TOKEN,
  # which (by GitHub Actions design, to prevent trigger loops) does NOT
  # fire the push-triggered run above -- so it explicitly dispatches this
  # workflow against that tag instead (`gh workflow run release.yml --ref
  # vX.Y.Z`). GITHUB_REF_NAME resolves to the dispatched ref exactly the
  # same way it would for a real tag push, so no other step here needs to
  # know or care which trigger fired it.
  workflow_dispatch: {}

env:
  GO_VERSION: "1.27"

jobs:
  package-debian:
    name: Build .deb (Debian)
    runs-on: ubuntu-latest
    container: golang:1.27-bookworm
    permissions:
      contents: read
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - env:
          CGO_ENABLED: "0"
        run: make deb PKG_VERSION=${{ steps.version.outputs.version }}
      - run: mv build/searchengine_${{ steps.version.outputs.version }}_amd64.deb build/searchengine_${{ steps.version.outputs.version }}_debian_amd64.deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: searchengine-debian-amd64-deb
          path: build/searchengine_${{ steps.version.outputs.version }}_debian_amd64.deb

  package-ubuntu:
    name: Build .deb (Ubuntu)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - env:
          CGO_ENABLED: "0"
        run: make deb PKG_VERSION=${{ steps.version.outputs.version }}
      - run: mv build/searchengine_${{ steps.version.outputs.version }}_amd64.deb build/searchengine_${{ steps.version.outputs.version }}_ubuntu_amd64.deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: searchengine-ubuntu-amd64-deb
          path: build/searchengine_${{ steps.version.outputs.version }}_ubuntu_amd64.deb

  # Separate .deb from package-debian/package-ubuntu above -- see
  # packaging/gpu-control/README.md for why gpu-control is never bundled
  # into the main searchengine package.
  package-debian-gpu-control:
    name: Build .deb (Debian, gpu-control)
    runs-on: ubuntu-latest
    container: golang:1.27-bookworm
    permissions:
      contents: read
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - env:
          CGO_ENABLED: "0"
        run: make deb-gpu-control PKG_VERSION=${{ steps.version.outputs.version }}
      - run: mv build/searchengine-gpu-control_${{ steps.version.outputs.version }}_amd64.deb build/searchengine-gpu-control_${{ steps.version.outputs.version }}_debian_amd64.deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: searchengine-gpu-control-debian-amd64-deb
          path: build/searchengine-gpu-control_${{ steps.version.outputs.version }}_debian_amd64.deb

  package-ubuntu-gpu-control:
    name: Build .deb (Ubuntu, gpu-control)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - env:
          CGO_ENABLED: "0"
        run: make deb-gpu-control PKG_VERSION=${{ steps.version.outputs.version }}
      - run: mv build/searchengine-gpu-control_${{ steps.version.outputs.version }}_amd64.deb build/searchengine-gpu-control_${{ steps.version.outputs.version }}_ubuntu_amd64.deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: searchengine-gpu-control-ubuntu-amd64-deb
          path: build/searchengine-gpu-control_${{ steps.version.outputs.version }}_ubuntu_amd64.deb

  package-docker:
    name: Build & push Docker image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Hardcoded lowercase, not github.repository_owner -- GHCR
          # rejects a mixed-case image path (this repo's own owner is
          # "M0WA"), and Actions expressions have no built-in lowercase
          # function to fix that inline.
          images: ghcr.io/m0wa/se
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Publish GitHub Release
    needs: [package-debian, package-ubuntu, package-debian-gpu-control, package-ubuntu-gpu-control]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          generate_release_notes: true
          files: |
            artifacts/searchengine-debian-amd64-deb/*.deb
            artifacts/searchengine-ubuntu-amd64-deb/*.deb
            artifacts/searchengine-gpu-control-debian-amd64-deb/*.deb
            artifacts/searchengine-gpu-control-ubuntu-amd64-deb/*.deb
