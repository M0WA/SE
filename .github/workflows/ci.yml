name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "24"
  PKG_VERSION: "1.0.0"

jobs:
  test:
    name: Build, vet & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: searchengine
          POSTGRES_PASSWORD: searchengine
          POSTGRES_DB: searchengine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U searchengine -d searchengine_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "$fmt_out"
            echo "gofmt found unformatted files (run 'gofmt -w .')"
            exit 1
          fi
      # internal/adapters/browserfetcher's real-Chromium tests (SE_BROWSER_TESTS
      # below) need Playwright's own downloaded driver+browser (cached here,
      # keyed on the pinned playwright-go version in go.sum so a version bump
      # invalidates it) plus the shared libraries Chromium links against
      # (playwright-go's own dependency installer doesn't reliably recognize
      # every distro, so these are listed explicitly -- names matching Ubuntu
      # 24.04 "noble", ubuntu-latest's current base).
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/ms-playwright-go
          key: playwright-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: Install Chromium runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnspr4 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2t64 libatspi2.0-0t64 libpango-1.0-0 \
            libxshmfence1
      # Renderer.ensureBrowser deliberately launches Chromium with its own
      # sandbox enabled (see internal/adapters/browserfetcher/renderer.go),
      # which needs unprivileged user namespaces -- blocked by default on
      # Ubuntu 23.10+ (including this runner's image). GitHub-hosted Linux
      # runners give the job user passwordless sudo, so this is liftable
      # here (unlike some other dev/CI sandboxes, where it stays blocked --
      # see skipIfNoUsableSandbox in renderer_test.go for that fallback).
      - name: Allow unprivileged user namespaces (needed for Chromium's own sandbox)
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: go test ./... -v
        env:
          TEST_POSTGRES_DSN: postgres://searchengine:searchengine@localhost:5432/searchengine_test?sslmode=disable
          # Actually run internal/adapters/browserfetcher's real-browser
          # tests here rather than skipping them (see requireBrowserTests'
          # doc comment) -- CI is exactly the "network-dependent, slow on
          # first run" cost that gate exists to spare a plain local
          # `go test ./...` from paying by default.
          SE_BROWSER_TESTS: "1"
      - name: npm ci
        run: npm ci
      - name: JS unit tests (with coverage)
        run: npm run test:coverage

  package-debian:
    name: Build .deb (Debian)
    needs: test
    runs-on: ubuntu-latest
    container: golang:1.27-bookworm
    permissions:
      contents: read
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - env:
          CGO_ENABLED: "0"
        run: make deb PKG_VERSION=${{ env.PKG_VERSION }}
      - run: mv build/searchengine_${{ env.PKG_VERSION }}_amd64.deb build/searchengine_${{ env.PKG_VERSION }}_debian_amd64.deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: searchengine-debian-amd64-deb
          path: build/searchengine_${{ env.PKG_VERSION }}_debian_amd64.deb

  package-ubuntu:
    name: Build .deb (Ubuntu)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - env:
          CGO_ENABLED: "0"
        run: make deb PKG_VERSION=${{ env.PKG_VERSION }}
      - run: mv build/searchengine_${{ env.PKG_VERSION }}_amd64.deb build/searchengine_${{ env.PKG_VERSION }}_ubuntu_amd64.deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: searchengine-ubuntu-amd64-deb
          path: build/searchengine_${{ env.PKG_VERSION }}_ubuntu_amd64.deb

  verify-install:
    name: Verify install (${{ matrix.distro }})
    needs: [package-debian, package-ubuntu]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:12
            artifact: searchengine-debian-amd64-deb
          - distro: ubuntu
            image: ubuntu:22.04
            artifact: searchengine-ubuntu-amd64-deb
    container: ${{ matrix.image }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.artifact }}
          path: pkg
      - name: Install package
        run: |
          apt-get update
          apt-get install -y curl
          apt-get install -y ./pkg/*.deb
      - name: Smoke test
        run: |
          dpkg -s searchengine
          # The public search page now requires a signed-in session (the
          # same admin account /admin uses) -- start admin-server alongside
          # search-server, sharing the same DB file, log in against it, and
          # reuse that session's cookie against search-server, the same way
          # a real deployment's shared "sessions" table lets one login work
          # across both processes.
          DB_DRIVER=sqlite DB_DSN='file:/tmp/smoke.db?cache=shared' \
            timeout 5 /usr/bin/searchengine-search &
          DB_DRIVER=sqlite DB_DSN='file:/tmp/smoke.db?cache=shared' \
            ADMIN_USER=smoke ADMIN_PASSWORD=smoke-password \
            timeout 5 /usr/bin/searchengine-admin &
          sleep 1
          curl -sf -c /tmp/smoke.jar -X POST -H 'Content-Type: application/json' \
            -d '{"username":"smoke","password":"smoke-password"}' \
            http://127.0.0.1:8081/login > /dev/null
          curl -sf -b /tmp/smoke.jar 'http://127.0.0.1:8080/search?q=test' | grep -q '"query"'
