# SonarCloud project configuration -- read by the CI-based scan step in
# .github/workflows/ci.yml (SonarSource/sonarqube-scan-action). Switching
# to a CI-based scan (this file didn't exist before -- the project ran
# purely on SonarCloud's own "Automatic Analysis" GitHub-App scan)
# unblocks feeding it real Go/JS coverage and fixes the encoding/Python-
# version warnings Automatic Analysis can't be configured to address at
# all. See CLAUDE.md's SonarCloud section for the full migration
# rationale and the false-positive-vs-required-check policy this
# repo uses for go:S2077 findings on internal/adapters/sqlrepo's r.ph()
# placeholder-substitution pattern.
sonar.projectKey=M0WA_SE
sonar.organization=m0wa

sonar.sources=.
# Everything actually shipped/maintained; excludes generated/vendored/
# build-only content that would just be noise (or, for node_modules,
# someone else's code this repo doesn't own).
sonar.exclusions=node_modules/**,build/**,docs/manual/images/**,docs/architecture/architecture.svg,**/*.test.js

sonar.sourceEncoding=UTF-8

# Only Python file in the repo (packaging/searxng-engine/searchengine_index.py)
# runs inside the searxng/searxng:latest Docker image -- not pinned to an
# exact Python version in this repo, so this covers the two most likely
# recent releases rather than guessing a single one.
sonar.python.version=3.11,3.12

# Go coverage -- produced by ci.yml's `go test -coverprofile=build/coverage.out`.
sonar.go.coverage.reportPaths=build/coverage.out

# JS coverage -- produced by scripts/js-test-coverage.js's lcov reporter
# (build/coverage-js.lcov), run via `npm run test:coverage` in the same CI
# job before this scan step.
sonar.javascript.lcov.reportPaths=build/coverage-js.lcov

# Coverage exclusions -- not a bar lowered for SonarCloud's sake, but the
# same "no test file for this" state CLAUDE.md's own testing-coverage
# section already documents as this repo's deliberate convention, applied
# consistently so the Quality Gate's New Code coverage condition measures
# only code this repo actually holds to a coverage bar:
#   - cmd/e2e-check/**: a manual, dev-host-only smoke tool, explicitly
#     never wired into CI or unit-tested (see its own package doc comment).
#   - cmd/*/main.go: each binary's wiring-only entrypoint, never unit
#     tested by this repo's own convention (`go test` already reports "no
#     test files" for cmd/search, cmd/admin, cmd/crawl) -- exercised by
#     cmd/e2e-check and manual verification instead, a different layer
#     than `go test`.
#   - **/*_bench_test.go: benchmark-only harnesses, executed under
#     `go test -bench` (never CI's own plain `go test`), so their own
#     helper functions never accumulate coverage hits regardless of how
#     they're factored.
#   - scripts/**: build/tooling scripts (e.g. the JS test runner itself),
#     not application logic -- outside internal/adapters/restapi/*.js,
#     which is what this repo's own "every script needs a test" policy
#     actually scopes to.
sonar.coverage.exclusions=cmd/e2e-check/**,cmd/*/main.go,**/*_bench_test.go,scripts/**

# Duplication exclusions -- test files only. This repo's own testing
# convention (see CLAUDE.md's Test coverage section: "one test per
# status code/branch" as the reference pattern for both Go and JS)
# deliberately produces many structurally similar test functions across
# a large suite; a duplication detector tuned for production code
# flags that endorsed style as a defect. Production code is not
# excluded here, so a real duplicated implementation still gets caught.
sonar.cpd.exclusions=**/*_test.go,**/*.test.js
