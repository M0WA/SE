# Deployed to /etc/nginx/conf.d/stub_status.conf. Exposes nginx's own
# request/connection counters (used by prometheus-nginx-exporter -- see
# ../prometheus/README.md) on a separate loopback-only server block, kept
# out of the public <DOMAIN> server blocks in searchengine.conf entirely
# so it can never be reached through the public listener regardless of
# path.
server {
    listen 127.0.0.1:8090;
    server_name localhost;

    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}
