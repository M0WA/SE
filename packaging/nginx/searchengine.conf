server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN>;

    location /login {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /logout {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx's own default (60s) is too short for a slow MCP tool
        # probe (e.g. "List tools" against a slow-starting stdio server)
        # -- see the / block's own comment for the real incident this
        # guards against.
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A /chat turn can legitimately take longer than nginx's own
        # default (60s): up to mcpclient.callTimeout (5 minutes) for a
        # single slow tool call (e.g. the "Image analyst" agent's first,
        # uncached easyocr model download), on top of whichever of
        # maxHookFollowUpRounds' rounds actually need one. Left at the
        # default, this surfaced live as a raw 504 instead of a real
        # answer or a graceful in-app tool error.
        proxy_read_timeout 300s;
    }
}
