# Upgrades a WebSocket request's Connection header through the proxy,
# closes it to a plain "close" for anything else -- needed for
# /admin/comfy/* (ComfyUI's own UI uses a websocket for live queue/
# progress updates); harmless no-op for every other /admin request, none
# of which ever upgrades. Must live outside the server{} block (nginx's
# map directive is only valid directly in the http{} context, which this
# file's own contents land inside once included from sites-enabled).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN>;

    location /login {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /logout {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx's own default (60s) is too short for a slow MCP tool
        # probe (e.g. "List tools" against a slow-starting stdio server)
        # -- see the / block's own comment for the real incident this
        # guards against.
        proxy_read_timeout 300s;
        # WebSocket passthrough, needed for /admin/comfy/* (see the
        # map directive above this server block).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A /chat turn can legitimately take longer than nginx's own
        # default (60s): up to mcpclient.callTimeout (5 minutes) for a
        # single slow tool call (e.g. the "Image analyst" agent's first,
        # uncached easyocr model download), on top of whichever of
        # maxHookFollowUpRounds' rounds actually need one. Left at the
        # default, this surfaced live as a raw 504 instead of a real
        # answer or a graceful in-app tool error.
        proxy_read_timeout 300s;
    }
}
