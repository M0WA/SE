## Deployed to /etc/systemd/system/prometheus-postgres-exporter.service.d/override.conf
## (systemctl edit prometheus-postgres-exporter --full is NOT what this is --
## this is a drop-in on top of the Debian package's own unit, so an apt
## upgrade of the package never clobbers it).
##
## Overrides the package's default EnvironmentFile (which would otherwise
## read an empty DATA_SOURCE_NAME from /etc/default/prometheus-postgres-
## exporter) to instead load searchengine's own DB_DSN and hand it to
## postgres-exporter-datasource.sh, which re-exports it under the name the
## exporter expects -- see that script's own comment for why.
##
## --web.listen-address is loopback-only, same reasoning as every other
## exporter in this directory.
##
## --disable-settings-metrics is not optional: this Postgres server has at
## least one pg_settings row with a NULL short_desc, which crashes the
## exporter's default settings-metrics query on every scrape ("Scan error
## on column index 3, name \"short_desc\": converting NULL to string is
## unsupported"). That failure's own error-wrapping logs the full DSN --
## password included -- to journalctl. Discovered by hitting it for real on
## se.mo-sys.de: the fix is this flag, not a query change on the Postgres
## side, since the exporter's own default query is what can't handle NULL.
##
## --collector.stat_statements powers Grafana's query-time panel (avg/min/max
## per query pattern, from pg_stat_statements_seconds_total/_calls_total --
## this exporter version has no min/max/mean columns, only cumulative
## totals). Requires the pg_stat_statements extension: `CREATE EXTENSION IF
## NOT EXISTS pg_stat_statements;` in the searchengine database -- no
## Postgres restart needed on this server (a managed instance that already
## preloads it via shared_preload_libraries; confirmed live, not assumed).
## A self-hosted Postgres without that preload would need shared_preload_
## libraries set and a restart first, which this flag alone can't do.
[Service]
EnvironmentFile=
EnvironmentFile=/etc/searchengine/searchengine.env
ExecStart=
ExecStart=/usr/local/bin/postgres-exporter-datasource.sh --web.listen-address=127.0.0.1:9187 --disable-settings-metrics --collector.stat_statements
