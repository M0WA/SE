## Deployed to /etc/prometheus/prometheus.yml. Runs Prometheus in --agent
## mode (see prometheus.default's ARGS): no local TSDB, no query API --
## it only scrapes the local exporters below and forwards everything
## to the IONOS monitoring platform via remote_write. See README.md.
##
## <IONOS_METRICS_ENDPOINT> and <IONOS_APIKEY> come from the monitoring
## pipeline created in the IONOS DCD (Observability > Monitoring). Fill
## these in on the deployed copy only -- never commit real values here.
##
## external_labels.site MUST be unique per host pushing into this same
## IONOS pipeline. Every host's node/nginx exporters produce identically-
## labeled series otherwise (job="node", instance="127.0.0.1:9100" is the
## same on every host, since each only ever scrapes its own loopback) --
## discovered when a second host (a GPU inference box) started silently
## colliding with se.mo-sys.de's own node_load1 etc. in the same Mimir
## series. Replace <SITE_NAME> with something host-identifying (e.g.
## se-mo-sys-de) on every deployed copy.

global:
  external_labels:
    site: <SITE_NAME>
  scrape_interval: 30s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: nginx
    static_configs:
      - targets: ["127.0.0.1:9113"]

  - job_name: postgres
    static_configs:
      - targets: ["127.0.0.1:9187"]

  # SearXNG (/opt/searxng on se.mo-sys.de, a separate Docker deployment --
  # not part of this repo/package) exposes its own OpenMetrics endpoint
  # once general.open_metrics is set to a password in its settings.yml;
  # that password is this scrape's basic_auth password too. Fill in on
  # the deployed copy only -- never commit the real value here.
  - job_name: searxng
    metrics_path: /metrics
    basic_auth:
      username: searxng
      password: "<SEARXNG_METRICS_PASSWORD>"
    static_configs:
      - targets: ["127.0.0.1:8888"]

remote_write:
  - url: "https://<IONOS_METRICS_ENDPOINT>/api/v1/push"
    headers:
      APIKEY: "<IONOS_APIKEY>"
