services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    # Host networking -- required so this container's loopback IS the
    # host's loopback: the searchengine engine (../searxng-engine/) talks
    # to cmd/search on 127.0.0.1:8080, which binds loopback-only for
    # security (see ../README.md's Notes) and is therefore unreachable
    # from a container on its own bridge network/IP -- a bridge network +
    # published port (the previous setup here) only forwards *inbound*
    # traffic to this container, it doesn't give the container a route to
    # a loopback-bound service on the host. GRANIAN_HOST/GRANIAN_PORT below
    # keep SearXNG itself bound to 127.0.0.1 only under host networking,
    # preserving the same no-firewall-in-front loopback-only posture the
    # old bridge + "127.0.0.1:8888:8080" port mapping gave us.
    network_mode: host
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      # ../searxng-engine/searchengine_index.py, copied here at deploy time
      # (see ../searxng-engine/README.md) -- the searxng/searxng image's own
      # engine modules live under /usr/local/searxng/searx/engines/.
      - ./searchengine_index.py:/usr/local/searxng/searx/engines/searchengine_index.py:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
      - GRANIAN_HOST=127.0.0.1
      - GRANIAN_PORT=8888
    # SearXNG's own documented minimal capability set: its entrypoint still
    # needs to chown/chmod its cache dir and drop from root to its own
    # unprivileged user on every start, which is what these four allow;
    # everything else a default container gets is dropped.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
